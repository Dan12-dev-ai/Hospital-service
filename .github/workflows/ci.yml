name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Hospital backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-hospital
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hospital
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-hospital/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest tests -q
      # Tables are created as the owner (this URL); the app and every test run as
      # the hospital_app role, under row-level security (tests/conftest.py).
      - name: Tests (PostgreSQL, as hospital_app)
        env:
          HOSPITAL_TEST_DATABASE_URL: postgresql+psycopg://hospital:ci-only@localhost:5432/hospital
        run: python -m pytest tests -q
      # As in production: migrations as the owner, which also creates or
      # updates hospital_app (migrations/env.py); then the app role uses it.
      - name: Migrations apply on PostgreSQL
        env:
          HOSPITAL_DATABASE_URL: postgresql+psycopg://hospital:ci-only@localhost:5432/hospital
          HOSPITAL_APP_DB_PASSWORD: ci-app-only
        run: |
          python -c "from app import models; from app.db import Base, get_engine; Base.metadata.drop_all(get_engine())"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: The app role works after the migrations, and only through the policies
        env:
          HOSPITAL_DATABASE_URL: postgresql+psycopg://hospital_app:ci-app-only@localhost:5432/hospital
        run: |
          python -m app.cli bootstrap --code CI --name "CI Hospital" --admin-email admin@ci.example --admin-name Admin
          python - <<'PY'
          from sqlalchemy import text
          from app.db import platform_session, session_scope
          with session_scope() as session:
              assert session.scalar(text("SELECT current_user")) == "hospital_app"
              assert session.scalar(text("SELECT count(*) FROM staff_users")) == 0, "no tenant must see nothing"
              assert session.scalar(text("SELECT hospital_of_staff_email('admin@ci.example')")) is not None
          with platform_session() as session:
              assert session.scalar(text("SELECT count(*) FROM staff_users")) == 1
          print("hospital_app: row-level security holds")
          PY
          # Encryption at rest after the migrations, with a real master key file.
          head -c 32 /dev/urandom > "$RUNNER_TEMP/master.key"
          export HOSPITAL_MASTER_KEY_FILE="$RUNNER_TEMP/master.key"
          python -m app.cli encrypt-existing
          python -m app.cli check-encryption

  backend-image:
    name: Hospital backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t endod-hospital backend-hospital

  portal:
    name: Hospital portal (build and browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-hospital-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-hospital-portal/package-lock.json
      - run: npm ci
      # The browser tests run against the real hospital service.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-hospital/requirements*.txt
      - name: Install the hospital service
        working-directory: backend-hospital
        run: pip install -r requirements.txt
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npx next build
      # After the build: it generates the route types the type check needs.
      - name: Type check
        run: npx tsc --noEmit
      # playwright.config.ts drives the `chrome` channel.
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome
      # The config starts uvicorn (throwaway SQLite database) and `next start`.
      - name: Browser tests
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-hospital-portal/playwright-report
            frontend-hospital-portal/test-results
          retention-days: 7

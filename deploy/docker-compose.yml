# The Endod hospital service: its own Postgres, the API, the event worker
# and the staff portal (hospital.endod-health.com).
#
# It shares nothing with the patient platform except the event bus: the
# worker and API join the "endod-bus" network that Endod's Compose project
# creates (Redis with Sentinel). Start that project first.
#
#   cd deploy && docker compose --env-file .env up -d --build
#
# Database roles: `hospital` (POSTGRES_USER) owns the database; only the
# one-shot `migrate` service connects as it, runs the Alembic migrations, and
# creates or updates the `hospital_app` role (migrations/env.py). The API and
# the worker connect as `hospital_app`: no DDL, no BYPASSRLS, so row-level
# security keeps every hospital's rows apart (backend-hospital/app/rls.py);
# they refuse to start as a superuser or the owner. Work for Endod across
# hospitals takes the NOLOGIN role `hospital_platform` for one transaction.
#
# Health data is encrypted at rest with a master key that only the API and
# the worker get, read-only: /opt/endod-hospital/deploy/keys/master.key
# (backend-hospital/README.md, "Encryption at rest"). Back it up offline.

name: endod-hospital

x-api-env: &api-env
  HOSPITAL_ENVIRONMENT: production
  # The app role, not the owner (see the top of this file).
  HOSPITAL_DATABASE_URL: postgresql+psycopg://hospital_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@postgres:5432/hospital
  HOSPITAL_CORS_ORIGINS: https://hospital.endod-health.com
  HOSPITAL_REDIS_SENTINELS: endod-sentinel-1:26379,endod-sentinel-2:26379,endod-sentinel-3:26379
  HOSPITAL_REDIS_SENTINEL_MASTER: endod
  HOSPITAL_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (the same as Endod's)}
  HOSPITAL_REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
  HOSPITAL_REDIS_MIN_REPLICAS: "1"
  HOSPITAL_JITSI_DOMAIN: meet.endod-health.com
  HOSPITAL_JITSI_APP_ID: endod
  HOSPITAL_JITSI_APP_SECRET: ${JITSI_APP_SECRET:?set JITSI_APP_SECRET (the same as Endod's)}
  HOSPITAL_PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY:?set PLATFORM_ADMIN_KEY}
  HOSPITAL_SIGNUP_ENABLED: "true"
  # Cloudflare adds the visitor and nginx adds Cloudflare; the portal passes
  # the header on unchanged. So the visitor is two entries from the right.
  HOSPITAL_TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
  # Patient history (docs/history-events.md): record files on a volume shared
  # by the API and the worker, and the platform API on the private bus
  # network (for files of records patients share with the hospital).
  HOSPITAL_FILES_DIR: /data/files
  HOSPITAL_PLATFORM_API_URL: http://endod-platform-api:8000
  # Encryption at rest: the master key, mounted below (API and worker only).
  HOSPITAL_MASTER_KEY_FILE: /run/secrets/master.key

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies the migrations as the owner, sets up the hospital_app role, then
  # exits. `up` runs it again each time; the API starts only after it succeeded.
  migrate:
    build: ../backend-hospital
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      HOSPITAL_ENVIRONMENT: production
      HOSPITAL_DATABASE_URL: postgresql+psycopg://hospital:${POSTGRES_PASSWORD}@postgres:5432/hospital
      HOSPITAL_APP_ROLE: hospital_app
      HOSPITAL_APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend-hospital
    restart: unless-stopped
    environment: *api-env
    volumes:
      - files:/data/files
      # The master key (backend-hospital/README.md, "Encryption at rest"):
      # read-only, the API and worker only; never created if missing.
      - type: bind
        source: ${MASTER_KEY_FILE:-/opt/endod-hospital/deploy/keys/master.key}
        target: /run/secrets/master.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      default: {}
      # The platform downloads record files from here (never through the portal).
      bus:
        aliases: [endod-hospital-api]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ../backend-hospital
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - files:/data/files
      # The master key (backend-hospital/README.md, "Encryption at rest"):
      # read-only, the API and worker only; never created if missing.
      - type: bind
        source: ${MASTER_KEY_FILE:-/opt/endod-hospital/deploy/keys/master.key}
        target: /run/secrets/master.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      disable: true
    networks: [default, bus]
    depends_on:
      api:
        condition: service_healthy

  portal:
    build: ../frontend-hospital-portal
    restart: unless-stopped
    environment:
      HOSPITAL_API_URL: http://api:8000
    networks:
      default: {}
      shared_edge:
        aliases: [endod-hospital-portal]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  files:

networks:
  bus:
    external: true
    name: endod-bus
  shared_edge:
    external: true
    name: ${SHARED_NGINX_NETWORK:-eyita_edge}
